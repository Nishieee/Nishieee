<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%">
  <!-- Floating hearts in background -->
  <text font-size="18" fill="#FF69B4" opacity="0.7">
    <animate attributeName="y" values="110;20;110" dur="4s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="x" values="120;140;120" dur="4s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="0s"/>
    ♡
  </text>
  <text font-size="16" fill="#FFB6C1" opacity="0.7">
    <animate attributeName="y" values="110;30;110" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="x" values="320;340;320" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite" begin="1s"/>
    ✨
  </text>
  <text font-size="18" fill="#FF69B4" opacity="0.7">
    <animate attributeName="y" values="110;25;110" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="x" values="520;540;520" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    ♡
  </text>
  <text font-size="16" fill="#FFB6C1" opacity="0.7">
    <animate attributeName="y" values="110;35;110" dur="3.8s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="x" values="680;700;680" dur="3.8s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3.8s" repeatCount="indefinite" begin="0.5s"/>
    ✨
  </text>

  <!-- Cat that walks back and forth -->
  <g>
    <animateTransform 
      attributeName="transform"
      type="translate"
      values="0,0; 700,0; 0,0"
      dur="14s"
      repeatCount="indefinite" />
    
    <!-- Subtle bounce -->
    <g>
      <animateTransform 
        attributeName="transform"
        type="translate"
        values="0,0; 0,-4; 0,0"
        dur="0.5s"
        repeatCount="indefinite" />
      
      <!-- Tail -->
      <path d="M 15 80 Q 0 65 5 50" stroke="#FFB6C1" stroke-width="6" fill="none" stroke-linecap="round">
        <animate attributeName="d" 
          values="M 15 80 Q 0 65 5 50;
                  M 15 80 Q -5 60 10 45;
                  M 15 80 Q 0 65 5 50"
          dur="0.6s"
          repeatCount="indefinite" />
      </path>
      
      <!-- Body -->
      <ellipse cx="50" cy="85" rx="38" ry="22" fill="#FFB6C1"/>
      
      <!-- Legs -->
      <rect x="30" y="95" width="8" height="15" rx="3" fill="#FFB6C1"/>
      <rect x="62" y="95" width="8" height="15" rx="3" fill="#FFB6C1"/>
      
      <!-- Head -->
      <circle cx="55" cy="55" r="26" fill="#FFB6C1"/>
      
      <!-- Ears outer -->
      <polygon points="36,40 38,18 50,35" fill="#FFB6C1"/>
      <polygon points="60,35 72,18 74,40" fill="#FFB6C1"/>
      <!-- Ears inner -->
      <polygon points="40,36 42,25 47,33" fill="#FF9FAF"/>
      <polygon points="63,33 68,25 70,36" fill="#FF9FAF"/>
      
      <!-- Eyes (blinking) -->
      <ellipse cx="46" cy="55" rx="3" ry="4" fill="#2D2D2D">
        <animate attributeName="ry" values="4;0.3;4;4;4" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="64" cy="55" rx="3" ry="4" fill="#2D2D2D">
        <animate attributeName="ry" values="4;0.3;4;4;4" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Eye shine -->
      <circle cx="47" cy="54" r="1" fill="white"/>
      <circle cx="65" cy="54" r="1" fill="white"/>
      
      <!-- Cheeks (blush) -->
      <circle cx="38" cy="62" r="3" fill="#FF85A2" opacity="0.6"/>
      <circle cx="72" cy="62" r="3" fill="#FF85A2" opacity="0.6"/>
      
      <!-- Nose -->
      <path d="M 53 62 L 57 62 L 55 65 Z" fill="#FF4D6D"/>
      
      <!-- Mouth -->
      <path d="M 55 65 Q 50 70 47 67" stroke="#2D2D2D" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M 55 65 Q 60 70 63 67" stroke="#2D2D2D" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      
      <!-- Whiskers -->
      <line x1="25" y1="62" x2="38" y2="62" stroke="#2D2D2D" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="25" y1="66" x2="38" y2="64" stroke="#2D2D2D" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="72" y1="62" x2="85" y2="62" stroke="#2D2D2D" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="72" y1="64" x2="85" y2="66" stroke="#2D2D2D" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
